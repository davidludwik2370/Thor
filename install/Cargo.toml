[package]
name = "thor-installer"
version = "0.41.6"
edition = "2021"
publish = false

[[bin]]
name = "thor-install"
path = "src/main.rs"

[dependencies]
sha2 = { version = "=0.11.0", default-features = false }
serde_json = "=1.0.150"
flate2 = "=1.0.35"
tar = "=0.4.43"

[profile.release]
lto = "thin"
strip = true

[profile.dev]
debug = 1
incremental = false

[profile.test]
debug = 1
incremental = false
