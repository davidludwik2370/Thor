name: Installer OS compatibility
on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Candidate draft or published release to verify
        required: true
        default: v0.41.11
        type: string
      public_install:
        description: Exercise the exact GitHub bootstrap command instead of a local candidate override
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  linux:
    # GitHub requires write-capable contents access to read unpublished drafts.
    # This manually dispatched job only downloads the candidate; it never edits it.
    permissions:
      contents: write
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        os: [ubuntu-22.04, ubuntu-22.04-arm]
        distro:
          - {name: ubuntu22, image: 'ubuntu:22.04'}
          - {name: ubuntu24, image: 'ubuntu:24.04'}
          - {name: debian12, image: 'debian:12'}
          - {name: fedora, image: 'fedora:latest'}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Acquire and verify the native candidate
        if: '!inputs.public_install'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          case "$(uname -m)" in x86_64) arch=x86_64;; aarch64) arch=aarch64;; *) exit 1;; esac
          mkdir -p "$RUNNER_TEMP/thor-candidate"
          gh release download "$RELEASE_TAG" --pattern "thor-*-linux-$arch.tar.gz*" --dir "$RUNNER_TEMP/thor-candidate"
          python3 tools/release_compatibility.py "$RUNNER_TEMP"/thor-candidate/*.tar.gz --report "$RUNNER_TEMP/linux-abi.json"
      - name: Clean install, real editor services, debugger, ordinary PATH and uninstall
        env:
          PUBLIC_INSTALL: ${{ inputs.public_install }}
          TEST_IMAGE: ${{ matrix.distro.image }}
          TEST_DISTRO: ${{ matrix.distro.name }}
        run: |
          args=()
          if [ "$PUBLIC_INSTALL" != true ]; then
            files=("$RUNNER_TEMP"/thor-candidate/*.tar.gz)
            args=(--bundle "${files[0]}")
          fi
          python3 tools/test_install_linux.py --image "$TEST_IMAGE" "${args[@]}" --output "$RUNNER_TEMP/compatibility/$TEST_DISTRO"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: installer-compatibility-${{ matrix.os }}-${{ matrix.distro.name }}
          path: ${{ runner.temp }}/compatibility/**
          retention-days: 3
          if-no-files-found: warn
