name: Installer
on:
  push:
    paths: ['install/**', 'thor-install*', 'tools/build_distribution.py', 'tests/test_installer*', '.github/workflows/installer.yml']
  pull_request:
    paths: ['install/**', 'thor-install*', 'tools/build_distribution.py', 'tests/test_installer*', '.github/workflows/installer.yml']
  workflow_dispatch:
    inputs:
      source_build:
        description: Build and install the complete toolchain from pinned source
        type: boolean
        default: true
      windows_only:
        description: Limit a source-install retry to the Windows host
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  native-installer:
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(inputs.windows_only && '["windows-2025"]' || '["ubuntu-24.04","ubuntu-24.04-arm","macos-15","macos-15-intel","windows-2025"]') }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Parse Windows bootstrap scripts
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          foreach($file in @('thor-install.ps1','install/prerequisites.ps1')) {
            $tokens=$null; $errors=$null
            $null=[System.Management.Automation.Language.Parser]::ParseFile((Join-Path (Get-Location) $file),[ref]$tokens,[ref]$errors)
            if ($errors.Count) {throw ($errors | Out-String)}
          }
      - name: Rust installer tests
        run: cargo test --locked --manifest-path install/Cargo.toml -j 2
      - name: Build installer fixture executable
        run: cargo build --release --locked --manifest-path install/Cargo.toml -j 2
      - name: Check standalone Windows installer imports
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          $vswhere=Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio\Installer\vswhere.exe'
          $vs=(& $vswhere -latest -products '*' -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath | Select-Object -First 1)
          $dumpbin=(Get-ChildItem "$vs\VC\Tools\MSVC\*\bin\Hostx64\x64\dumpbin.exe" | Sort-Object FullName -Descending | Select-Object -First 1).FullName
          $imports=& $dumpbin /DEPENDENTS install\target\release\thor-install.exe
          if ($LASTEXITCODE -ne 0) {throw 'Could not inspect installer dependencies'}
          if (($imports -join "`n") -match '(?im)^\s*(VCRUNTIME|MSVCP)[^\s]*\.dll\s*$') {throw 'Installer requires an external VC runtime before prerequisite installation'}
      - name: Installer regression tests
        run: python -m unittest tests.test_installer tests.test_installer_source tests.test_installer_prerequisites tests.test_ols_source
      - name: Complete POSIX source installation
        if: runner.os != 'Windows' && github.event_name == 'workflow_dispatch' && inputs.source_build
        run: ./thor-install --from-source --prefix "$RUNNER_TEMP/thor-install" --path --export-bundle "$RUNNER_TEMP/thor-release"
      - name: Complete Windows source installation
        if: runner.os == 'Windows' && github.event_name == 'workflow_dispatch' && inputs.source_build
        shell: powershell
        run: |
          # Preserve process-only PATH entries while refreshing installed tools.
          $sentinel=Join-Path $env:RUNNER_TEMP 'thor-prerequisite-sentinel'
          New-Item -ItemType Directory -Force $sentinel | Out-Null
          Set-Content -LiteralPath (Join-Path $sentinel 'thor-prerequisite-sentinel.cmd') -Value '@exit /b 0'
          $env:PATH=$sentinel+';'+$env:PATH
          . .\install\prerequisites.ps1 -SourceBuild
          if (!(Get-Command thor-prerequisite-sentinel -ErrorAction SilentlyContinue)) {throw 'Prerequisite setup lost the process PATH'}
          .\thor-install.ps1 --from-source --prefix "$env:RUNNER_TEMP\thor-install" --path --export-bundle "$env:RUNNER_TEMP\thor-release"
      - name: Retain verified native release bundle
        if: github.event_name == 'workflow_dispatch' && inputs.source_build
        uses: actions/upload-artifact@v4
        with:
          name: thor-native-${{ matrix.os }}
          path: ${{ runner.temp }}/thor-release/*
          if-no-files-found: error
          retention-days: 3
      - name: POSIX doctor and uninstall
        if: runner.os != 'Windows' && github.event_name == 'workflow_dispatch' && inputs.source_build
        run: |
          ./thor-install --doctor --prefix "$RUNNER_TEMP/thor-install"
          ./thor-install --uninstall --prefix "$RUNNER_TEMP/thor-install"
      - name: Windows doctor and uninstall
        if: runner.os == 'Windows' && github.event_name == 'workflow_dispatch' && inputs.source_build
        shell: powershell
        run: |
          .\thor-install.ps1 --doctor --prefix "$env:RUNNER_TEMP\thor-install"
          .\thor-install.ps1 --uninstall --prefix "$env:RUNNER_TEMP\thor-install"
