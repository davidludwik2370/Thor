name: Installer bundle verification
on:
  workflow_dispatch:
    inputs:
      source_run:
        description: Successful Installer source-build run containing the Windows bundle
        type: string
        required: true
permissions:
  contents: read
  actions: read
jobs:
  windows-editor:
    runs-on: windows-2025
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: thor-native-windows-2025
          run-id: ${{ inputs.source_run }}
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/source-bundle
      - name: Build current standalone installer
        run: cargo build --release --locked --manifest-path install/Cargo.toml -j 2
      - name: Build current transpiler
        run: cargo build --release --locked --manifest-path rust/Cargo.toml --bin thor-rust -j 2
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Package current editor extension
        working-directory: editors/vscode
        shell: powershell
        run: |
          npm ci --no-audit --no-fund
          if ($LASTEXITCODE -ne 0) {throw 'Could not install editor packaging dependencies'}
          npm run package
          if ($LASTEXITCODE -ne 0) {throw 'Could not package current Thor extension'}
      - name: Repackage and verify editor installation
        shell: powershell
        run: |
          $bundle=Get-ChildItem "$env:RUNNER_TEMP\source-bundle\*.tar.gz" | Select-Object -First 1
          $expected=(Get-Content ($bundle.FullName+'.sha256')).Split(' ')[0]
          if ((Get-FileHash $bundle.FullName -Algorithm SHA256).Hash.ToLower() -ne $expected) {throw 'Source artifact checksum mismatch'}
          $root=Join-Path $env:RUNNER_TEMP 'bundle-input'
          New-Item -ItemType Directory -Force $root | Out-Null
          tar -xzf $bundle.FullName -C $root
          if ($LASTEXITCODE -ne 0) {throw 'Could not extract source artifact'}
          python tools/test_ols_json_compat.py --odin "$root\odin\odin.exe"
          if ($LASTEXITCODE -ne 0) {throw 'OLS SDK JSON compatibility checks failed'}
          $version=(Get-Content release/version -Raw).Trim()
          & "$root\odin\odin.exe" build tls/src "-collection:src=$PWD/tls/src" "-collection:thor=$PWD/frontend" -o:speed -thread-count:2 "-define:VERSION=thor-$version+ols-0c9438f" "-out:$env:RUNNER_TEMP\tls.exe"
          if ($LASTEXITCODE -ne 0) {throw 'Could not build current TLS'}
          python tools/build_distribution.py --odin "$root\odin\odin.exe" --compiler rust/target/release/thor-rust.exe --installer install/target/release/thor-install.exe --tls "$env:RUNNER_TEMP\tls.exe" --vsix editors/vscode/thor-language.vsix --ols-source "$root\ols" --output "$env:RUNNER_TEMP\verified-release"
          if ($LASTEXITCODE -ne 0) {throw 'Could not package current installer'}
          $release=(Get-ChildItem "$env:RUNNER_TEMP\verified-release\*.tar.gz" | Select-Object -First 1).FullName
          .\thor-install.ps1 --bundle $release --prefix "$env:RUNNER_TEMP\thor-final" --path --vscode --code-user-data "$env:RUNNER_TEMP\code-data" --extensions-dir "$env:RUNNER_TEMP\code-extensions"
          if ($LASTEXITCODE -ne 0) {throw 'Editor installation verification failed'}
          .\thor-install.ps1 --doctor --prefix "$env:RUNNER_TEMP\thor-final"
          if ($LASTEXITCODE -ne 0) {throw 'Doctor failed'}
          .\thor-install.ps1 --uninstall --prefix "$env:RUNNER_TEMP\thor-final"
          if ($LASTEXITCODE -ne 0) {throw 'Uninstall failed'}
          .\thor-install.ps1 --uninstall --prefix "$env:RUNNER_TEMP\thor-final"
          if ($LASTEXITCODE -ne 0) {throw 'Repeated uninstall failed'}
      - uses: actions/upload-artifact@v4
        with:
          name: thor-verified-windows
          path: ${{ runner.temp }}/verified-release/*
          if-no-files-found: error
          retention-days: 3
