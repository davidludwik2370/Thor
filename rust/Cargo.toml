[package]
name = "thor-compiler"
version = "0.41.6"
edition = "2021"
rust-version = "1.85"
publish = false

[lib]
name = "thor_compiler"

[[bin]]
name = "thor-rust"
path = "src/main.rs"

[dependencies]
num-bigint = "0.4.6"
num-traits = "0.2.19"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = { version = "1.0.150", features = ["float_roundtrip"] }
unicode-ident = "1.0.24"
image = { version = "=0.25.5", default-features = false, features = ["png", "ico"] }
toml = "=0.8.23"
flate2 = "=1.0.35"
tar = "=0.4.43"
zip = { version = "=2.4.2", default-features = false, features = ["deflate-flate2", "flate2"] }
filetime = "=0.2.29"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "debuginfo"

