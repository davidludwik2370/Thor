[package]
name = "thor-compiler"
version = "0.41.6"
edition = "2021"
rust-version = "1.85"
publish = false

[lib]
name = "thor_compiler"

[[bin]]
name = "thor-rust"
path = "src/main.rs"

[dependencies]
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
unicode-ident = "1.0.24"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "debuginfo"

